name: Weekly publish

on:
  schedule:
    # 毎週月曜 21:00 JST (12:00 UTC) に実行
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish next queued article
        run: python3 scripts/publish_next.py

      - name: Commit and push if changed
        run: |
          git config user.name "auto-publish-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: weekly auto-publish"
            git push
          else
            echo "no changes to publish this week"
          fi
